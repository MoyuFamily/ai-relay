name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'ai-relay' }}
      CLOUDFLARE_PAGES_PRODUCTION_BRANCH: main

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ Error: CLOUDFLARE_API_TOKEN is not set"
            echo "Please add it in Settings → Secrets and variables → Actions"
            echo "Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ Error: CLOUDFLARE_ACCOUNT_ID is not set"
            echo "Please add it in Settings → Secrets and variables → Actions"
            echo "Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          if [ -z "${{ secrets.RELAY_API_KEY }}" ]; then
            echo "❌ Error: RELAY_API_KEY is not set"
            echo "Please add it in Settings → Secrets and variables → Actions"
            echo "Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          echo "✅ All required secrets are configured"

      - name: Provision Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          PROJECT_NAME="${CLOUDFLARE_PAGES_PROJECT_NAME}"
          D1_NAME="${PROJECT_NAME}"

          # Keep wrangler.toml project & D1 names aligned with CLOUDFLARE_PAGES_PROJECT_NAME
          sed -i "s|^name = .*|name = \"${PROJECT_NAME}\"|" wrangler.toml
          sed -i "s|^database_name = .*|database_name = \"${D1_NAME}\"|" wrangler.toml

          # ─── D1 Database ───────────────────────────────────────────
          echo "=== Provisioning D1 database (${D1_NAME}) ==="

          # Try to get database ID from existing databases
          echo "Fetching D1 database list..."
          D1_LIST_OUT=$(pnpm exec wrangler d1 list --json 2>&1 || pnpm exec wrangler d1 list 2>&1 || echo "[]")
          echo "D1 list output:"
          echo "$D1_LIST_OUT" | head -20

          # Try JSON parsing first
          DATABASE_ID=$(echo "$D1_LIST_OUT" | jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' 2>/dev/null || echo "")

          # Fallback: grep UUID from any format (JSON or plain text)
          if [ -z "$DATABASE_ID" ] || [ "$DATABASE_ID" = "null" ]; then
            echo "JSON parsing failed, trying regex extraction..."
            DATABASE_ID=$(echo "$D1_LIST_OUT" | grep -A 5 -i "${D1_NAME}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || echo "")
          fi

          # If still not found, try creating it
          if [ -z "$DATABASE_ID" ] || [ "$DATABASE_ID" = "null" ]; then
            echo "D1 database not found, attempting to create..."
            CREATE_OUT=$(pnpm exec wrangler d1 create "${D1_NAME}" 2>&1 || true)
            echo "$CREATE_OUT"

            # Extract UUID from create output
            DATABASE_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || echo "")

            # If creation failed because it exists, fetch the list again with more attempts
            if [ -z "$DATABASE_ID" ] || [ "$DATABASE_ID" = "null" ]; then
              if echo "$CREATE_OUT" | grep -qi "already exists\|name already in use"; then
                echo "Database exists but UUID not found. Retrying fetch with verbose output..."
                sleep 2

                for i in 1 2 3; do
                  echo "Attempt $i to fetch database list..."
                  D1_LIST_OUT=$(pnpm exec wrangler d1 list 2>&1 || echo "")
                  echo "$D1_LIST_OUT"

                  DATABASE_ID=$(echo "$D1_LIST_OUT" | jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' 2>/dev/null || echo "")
                  if [ -z "$DATABASE_ID" ] || [ "$DATABASE_ID" = "null" ]; then
                    DATABASE_ID=$(echo "$D1_LIST_OUT" | grep -A 5 -i "${D1_NAME}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || echo "")
                  fi

                  if [ -n "$DATABASE_ID" ] && [ "$DATABASE_ID" != "null" ]; then
                    echo "✅ Found database UUID on attempt $i"
                    break
                  fi

                  sleep 2
                done
              fi
            fi
          else
            echo "✅ D1 database already exists"
          fi

          echo ""
          echo "D1 database_id: ${DATABASE_ID:-<empty>}"

          if [ -z "$DATABASE_ID" ] || [ "$DATABASE_ID" = "null" ]; then
            echo "❌ Failed to obtain D1 database_id after all attempts"
            echo "Check that CLOUDFLARE_API_TOKEN has D1:Edit permission."
            echo "Last D1 list output:"
            echo "$D1_LIST_OUT"
            exit 1
          fi

          echo "✅ Successfully obtained D1 database_id: $DATABASE_ID"

          # Inject database_id into wrangler.toml
          if grep -q "database_id" wrangler.toml; then
            sed -i "s|database_id = .*|database_id = \"${DATABASE_ID}\"|" wrangler.toml
          else
            sed -i "/database_name = \"${D1_NAME}\"/a database_id = \"${DATABASE_ID}\"" wrangler.toml
          fi

          # ─── KV Namespace ──────────────────────────────────────────
          echo ""
          echo "=== Provisioning KV namespace ==="

          KV_LIST=$(pnpm exec wrangler kv namespace list 2>/dev/null | awk '/^\[/{f=1} f' || echo "[]")
          [ -z "$KV_LIST" ] && KV_LIST="[]"
          echo "KV namespaces found: $(echo "$KV_LIST" | jq 'length' 2>/dev/null || echo 'unknown')"

          KV_ID=""
          for TITLE in "${PROJECT_NAME}" "${PROJECT_NAME}-KV" "ai-relay" "ai-relay-KV" "KV" "${PROJECT_NAME}-${PROJECT_NAME}"; do
            FOUND=$(echo "$KV_LIST" | jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .id' 2>/dev/null || echo "")
            if [ -n "$FOUND" ] && [ "$FOUND" != "null" ]; then
              KV_ID="$FOUND"
              echo "Found existing KV namespace: title=${TITLE}, id=${KV_ID}"
              break
            fi
          done

          if [ -z "$KV_ID" ]; then
            echo "No existing KV namespace found, creating one..."
            KV_OUTPUT=$(pnpm exec wrangler kv namespace create KV 2>&1 || true)
            echo "$KV_OUTPUT"

            if echo "$KV_OUTPUT" | grep -qi "already exists"; then
              echo "Namespace already exists (title conflict); re-fetching list to obtain id..."
              KV_LIST=$(pnpm exec wrangler kv namespace list 2>/dev/null | awk '/^\[/{f=1} f' || echo "[]")
              [ -z "$KV_LIST" ] && KV_LIST="[]"
              for TITLE in "${PROJECT_NAME}" "${PROJECT_NAME}-KV" "ai-relay" "ai-relay-KV" "KV" "${PROJECT_NAME}-${PROJECT_NAME}"; do
                FOUND=$(echo "$KV_LIST" | jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .id' 2>/dev/null || echo "")
                if [ -n "$FOUND" ] && [ "$FOUND" != "null" ]; then
                  KV_ID="$FOUND"
                  echo "Recovered KV namespace: title=${TITLE}, id=${KV_ID}"
                  break
                fi
              done
            else
              KV_ID=$(echo "$KV_OUTPUT" | jq -r '.id' 2>/dev/null || echo "")
              if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
                KV_ID=$(echo "$KV_OUTPUT" | grep -oE '[0-9a-f]{32}' | head -1 || echo "")
              fi
            fi
          fi

          echo "KV namespace id: $KV_ID"

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "❌ Failed to obtain KV namespace id"
            echo "Check that CLOUDFLARE_API_TOKEN has Workers KV Storage:Edit permission."
            echo "Debug: KV list output was:"
            echo "$KV_LIST" | head -20
            exit 1
          fi

          # Inject KV id into wrangler.toml
          if grep -q "^id = " wrangler.toml; then
            sed -i "s|^id = .*|id = \"${KV_ID}\"|" wrangler.toml
          else
            sed -i "/binding = \"KV\"/a id = \"${KV_ID}\"" wrangler.toml
          fi

          # ─── Verify ────────────────────────────────────────────────
          echo ""
          echo "=== Final wrangler.toml ==="
          cat wrangler.toml

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          CREATE_OUT=$(pnpm exec wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT_NAME" --production-branch "$CLOUDFLARE_PAGES_PRODUCTION_BRANCH" 2>&1)
          CREATE_STATUS=$?
          set -e
          echo "$CREATE_OUT"
          if [ "$CREATE_STATUS" -ne 0 ]; then
            if echo "$CREATE_OUT" | grep -qiE "already exists|8000002|A project with this name already exists"; then
              echo "✅ Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}' already exists"
            else
              echo "❌ Failed to create/verify Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}'."
              echo "Check that CLOUDFLARE_API_TOKEN has 'Cloudflare Pages:Edit' permission."
              exit "$CREATE_STATUS"
            fi
          fi

      - name: Build for Cloudflare Pages
        run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NODE_ENV: production

      - name: Adapt Build Output for Cloudflare Pages
        run: |
          set -euo pipefail
          # Copy static assets to the root of .open-next so they can be served directly by Pages
          if [ -d ".open-next/assets" ]; then
            cp -r .open-next/assets/* .open-next/
          fi

          # Materialize statically prerendered app routes so Pages can serve them
          # without passing `/` and `/admin` through the worker.
          CACHE_DIR="$(find .open-next/cache -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -z "$CACHE_DIR" ]; then
            echo "❌ No OpenNext cache directory found"
            exit 1
          fi

          CACHE_DIR="$CACHE_DIR" node -e '
            const fs = require("fs");
            const path = require("path");

            const cacheDir = process.env.CACHE_DIR;
            const outputRoot = ".open-next";
            const entries = [
              ["index.cache", "index.html", "/"],
              ["admin.cache", path.join("admin", "index.html"), "/admin"],
              ["_not-found.cache", "404.html", null]
            ];

            const staticExcludes = [
              "/_next/static/*",
              "/favicon.ico",
              "/*.png",
              "/*.ico",
              "/*.txt",
              "/*.svg"
            ];

            for (const [source, target, routePath] of entries) {
              const input = path.join(cacheDir, source);
              if (!fs.existsSync(input)) {
                console.warn(`⚠️ Cache file not found (will route dynamically): ${source}`);
                continue;
              }
              const payload = JSON.parse(fs.readFileSync(input, "utf8"));
              if (!payload || !payload.html) continue;
              const output = path.join(outputRoot, target);
              fs.mkdirSync(path.dirname(output), { recursive: true });
              fs.writeFileSync(output, payload.html);
              if (routePath) {
                staticExcludes.unshift(routePath);
              }
            }

            // Only exclude static routes that were actually materialized, preventing silent 404s.
            const routesConfig = {
              version: 1,
              include: ["/*"],
              exclude: staticExcludes
            };
            fs.writeFileSync(path.join(outputRoot, "_routes.json"), JSON.stringify(routesConfig));
            console.log("Generated _routes.json:", JSON.stringify(routesConfig));
          '

          # Rename worker.js to _worker.js to enable Pages Functions
          if [ -f ".open-next/worker.js" ]; then
            mv .open-next/worker.js .open-next/_worker.js
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}"
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"
          pnpm exec wrangler d1 migrations apply "$CLOUDFLARE_PAGES_PROJECT_NAME" --remote

      - name: Configure environment variables
        # Must run BEFORE the deploy step: Cloudflare Pages only binds
        # secrets/vars to the NEXT deployment, never retroactively.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_RELAY_API_KEY: ${{ secrets.RELAY_API_KEY || vars.RELAY_API_KEY }}
          SYNC_RELAY_ADMIN_KEY: ${{ secrets.RELAY_ADMIN_KEY || vars.RELAY_ADMIN_KEY }}
          SYNC_RELAY_SIGNING_SECRET: ${{ secrets.RELAY_SIGNING_SECRET || vars.RELAY_SIGNING_SECRET }}
          SYNC_DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET || vars.DEVICE_TOKEN_SECRET }}
          SYNC_CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
          SYNC_OPENAI_KEYS: ${{ secrets.OPENAI_KEYS || vars.OPENAI_KEYS }}
          SYNC_CLAUDE_KEYS: ${{ secrets.CLAUDE_KEYS || vars.CLAUDE_KEYS }}
          SYNC_GEMINI_KEYS: ${{ secrets.GEMINI_KEYS || vars.GEMINI_KEYS }}
          SYNC_DEEPSEEK_KEYS: ${{ secrets.DEEPSEEK_KEYS || vars.DEEPSEEK_KEYS }}
          SYNC_OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS || vars.OPENROUTER_KEYS }}
          SYNC_XIAOMI_KEYS: ${{ secrets.XIAOMI_KEYS || vars.XIAOMI_KEYS }}
          SYNC_XIAOMI_CODING_KEYS: ${{ secrets.XIAOMI_CODING_KEYS || vars.XIAOMI_CODING_KEYS }}
          SYNC_XIAOMIMIMO_SGP_CODING_KEYS: ${{ secrets.XIAOMIMIMO_SGP_CODING_KEYS || vars.XIAOMIMIMO_SGP_CODING_KEYS }}
          SYNC_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          SYNC_CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL || vars.CLAUDE_BASE_URL }}
          SYNC_GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL || vars.GEMINI_BASE_URL }}
          SYNC_DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || vars.DEEPSEEK_BASE_URL }}
          SYNC_OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL || vars.OPENROUTER_BASE_URL }}
          SYNC_XIAOMI_BASE_URL: ${{ secrets.XIAOMI_BASE_URL || vars.XIAOMI_BASE_URL }}
          SYNC_XIAOMI_CODING_BASE_URL: ${{ secrets.XIAOMI_CODING_BASE_URL || vars.XIAOMI_CODING_BASE_URL }}
          SYNC_XIAOMIMIMO_SGP_CODING_BASE_URL: ${{ secrets.XIAOMIMIMO_SGP_CODING_BASE_URL || vars.XIAOMIMIMO_SGP_CODING_BASE_URL }}
          SYNC_RELAY_DAILY_LIMIT: ${{ secrets.RELAY_DAILY_LIMIT || vars.RELAY_DAILY_LIMIT }}
          SYNC_RELAY_MONTHLY_LIMIT: ${{ secrets.RELAY_MONTHLY_LIMIT || vars.RELAY_MONTHLY_LIMIT }}
          SYNC_RELAY_MAX_CONCURRENT: ${{ secrets.RELAY_MAX_CONCURRENT || vars.RELAY_MAX_CONCURRENT }}
          SYNC_RELAY_MAX_QUEUE: ${{ secrets.RELAY_MAX_QUEUE || vars.RELAY_MAX_QUEUE }}
          SYNC_RELAY_KEY_POOL_VERSION_CHECK_TTL_MS: ${{ secrets.RELAY_KEY_POOL_VERSION_CHECK_TTL_MS || vars.RELAY_KEY_POOL_VERSION_CHECK_TTL_MS }}
          SYNC_RELAY_KV_KEY_USAGE_MODE: ${{ secrets.RELAY_KV_KEY_USAGE_MODE || vars.RELAY_KV_KEY_USAGE_MODE }}
          SYNC_RELAY_KV_USAGE_SAMPLE_RATE: ${{ secrets.RELAY_KV_USAGE_SAMPLE_RATE || vars.RELAY_KV_USAGE_SAMPLE_RATE }}
          SYNC_RELAY_KV_KEY_USAGE_SAMPLE_RATE: ${{ secrets.RELAY_KV_KEY_USAGE_SAMPLE_RATE || vars.RELAY_KV_KEY_USAGE_SAMPLE_RATE }}
          SYNC_RELAY_KV_ERROR_DETAIL_SAMPLE_RATE: ${{ secrets.RELAY_KV_ERROR_DETAIL_SAMPLE_RATE || vars.RELAY_KV_ERROR_DETAIL_SAMPLE_RATE }}
          SYNC_ENABLE_REQUEST_LOGS: ${{ secrets.ENABLE_REQUEST_LOGS || vars.ENABLE_REQUEST_LOGS }}
          SYNC_REQUEST_LOGS_MAX_ENTRIES: ${{ secrets.REQUEST_LOGS_MAX_ENTRIES || vars.REQUEST_LOGS_MAX_ENTRIES }}
          SYNC_RELAY_UPSTREAM_TIMEOUT_MS: ${{ secrets.RELAY_UPSTREAM_TIMEOUT_MS || vars.RELAY_UPSTREAM_TIMEOUT_MS }}
          SYNC_RELAY_MAX_REQUEST_BYTES: ${{ secrets.RELAY_MAX_REQUEST_BYTES || vars.RELAY_MAX_REQUEST_BYTES }}
          SYNC_RELAY_DEFAULT_USER_AGENT: ${{ secrets.RELAY_DEFAULT_USER_AGENT || vars.RELAY_DEFAULT_USER_AGENT }}
          SYNC_RELAY_API_KEY_MIN_LENGTH: ${{ secrets.RELAY_API_KEY_MIN_LENGTH || vars.RELAY_API_KEY_MIN_LENGTH }}
          SYNC_RELAY_STREAM_BYTES_PER_TOKEN: ${{ secrets.RELAY_STREAM_BYTES_PER_TOKEN || vars.RELAY_STREAM_BYTES_PER_TOKEN }}
          SYNC_CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || vars.CORS_ORIGINS }}
          SYNC_RELAY_ALLOWED_ORIGINS: ${{ secrets.RELAY_ALLOWED_ORIGINS || vars.RELAY_ALLOWED_ORIGINS }}
          SYNC_DEPLOY_URL: ${{ secrets.DEPLOY_URL || vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}"
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"

          if [ "${GITHUB_REF_NAME}" = "${CLOUDFLARE_PAGES_PRODUCTION_BRANCH}" ]; then
            PAGES_ENV="production"
          else
            PAGES_ENV="preview"
          fi
          echo "Target Pages environment: ${PAGES_ENV} (branch=${GITHUB_REF_NAME}, production branch=${CLOUDFLARE_PAGES_PRODUCTION_BRANCH})"

          SECRETS_FILE="$(mktemp)"
          trap 'rm -f "$SECRETS_FILE"' EXIT

          node -e '
            const fs = require("fs");
            const out = {};
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith("SYNC_") && v) {
                out[k.slice(5)] = v;
              }
            }
            fs.writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
            console.log("Prepared", Object.keys(out).length, "secret(s):", Object.keys(out).sort().join(", "));
          ' "$SECRETS_FILE"

          if [ "$(node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))).length)' "$SECRETS_FILE")" -gt 0 ]; then
            if ! pnpm exec wrangler pages secret bulk "$SECRETS_FILE" --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --env "$PAGES_ENV"; then
              echo "⚠️ Bulk secret upload failed, falling back to per-key upload..."
              for var_name in $(env | grep -oE '^SYNC_[A-Z0-9_]+' | sort -u); do
                target_name="${var_name#SYNC_}"
                val="${!var_name}"
                if [ -n "$val" ]; then
                  printf '%s' "$val" | pnpm exec wrangler pages secret put "$target_name" --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --env "$PAGES_ENV"
                fi
              done
            fi
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}"
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"
          DEPLOY_OUT=$(pnpm exec wrangler pages deploy .open-next --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="${GITHUB_REF_NAME}" 2>&1)
          echo "$DEPLOY_OUT"

          DEPLOY_PREVIEW_URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' | tail -1 || true)
          PROD_URL="https://${CLOUDFLARE_PAGES_PROJECT_NAME}.pages.dev"
          TARGET_URL="${DEPLOY_PREVIEW_URL:-$PROD_URL}"

          {
            echo "### ⚡ Cloudflare Pages Deployment Succeeded"
            echo ""
            echo "- **Production URL**: ${PROD_URL}"
            if [ -n "$DEPLOY_PREVIEW_URL" ] && [ "$DEPLOY_PREVIEW_URL" != "$PROD_URL" ]; then
              echo "- **Deployment URL**: ${DEPLOY_PREVIEW_URL}"
            fi
            echo "- **Admin Panel**: ${PROD_URL}/admin"
            echo "- **Liveness Check**: \`curl ${TARGET_URL}/health?liveness=1\`"
            echo ""
            echo "> 💡 **Tip**: Open \`/admin\` to add your upstream provider keys. To enable daily scheduled health probes, usage rollups, D1 cleanup, and webhook reports via GitHub Actions (\`cron.yml\`), add \`DEPLOY_URL=${PROD_URL}\` to your repository Actions variables or secrets."
          } >> "$GITHUB_STEP_SUMMARY"
